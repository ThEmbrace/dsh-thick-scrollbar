<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-thick-scrollbar visual probe</title>
    <style>
      /* Baseline injected by the plugin at load time. */
      html body {
        --dsh-scrollbar-width: 10px;
        --dsh-scrollbar-thumb-border: 2.5px;
      }
    </style>
    <style>
      /* Verbatim geometry + paint rules from dsh-client-ui-theme scrollbar.css. */
      body {
        --dsh-scrollbar-thumb: #b9b9b9;
        --dsh-scrollbar-thumb-hover: #8f8f8f;
        --dsh-scrollbar-track-margin: 2px;
        margin: 0;
        padding: 24px;
        background: #f7f7f8;
        font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
        color: #333;
      }
      ::-webkit-scrollbar {
        width: var(--dsh-scrollbar-width);
        height: var(--dsh-scrollbar-width);
      }
      ::-webkit-scrollbar-track {
        margin-block: var(--dsh-scrollbar-track-margin);
        background: 0 0;
      }
      ::-webkit-scrollbar-thumb {
        border: var(--dsh-scrollbar-thumb-border) solid transparent;
        corner-shape: round;
        background: var(--dsh-scrollbar-thumb);
        background-clip: content-box;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--dsh-scrollbar-thumb-hover);
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
      .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
      figure { margin: 0; }
      figcaption { margin-top: 8px; font-size: 12px; color: #666; }
      .panel {
        width: 240px;
        height: 260px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid #e2e2e4;
        border-radius: 10px;
        padding: 0;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      }
      .panel p { margin: 0; padding: 8px 12px; border-bottom: 1px solid #f0f0f1; }
      /* Zoom the right-hand pair so a 5px vs 10px thumb is visible in a screenshot. */
      .zoom { transform: scale(1.6); transform-origin: top left; }
      .label { font: 11px ui-monospace, monospace; color: #888; }
    </style>
  </head>
  <body>
    <h1>dsh-thick-scrollbar · 静止 5px ↔ 悬停 10px（真实主题 CSS，1:1 与 1.6× 放大）</h1>
    <div class="row">
      <figure>
        <div class="panel" id="rest">
          <p>静止态（默认）</p><p>滚动槽 10px，透明边框 2.5px</p><p>绘制宽度 5px</p>
          <p>line</p><p>line</p><p>line</p><p>line</p><p>line</p><p>line</p>
          <p>line</p><p>line</p><p>line</p><p>line</p><p>line</p><p>line</p>
        </div>
        <figcaption>1:1 · 静止 <span class="label">painted 5px</span></figcaption>
      </figure>
      <figure>
        <div class="panel" id="armed">
          <p>悬停态</p><p>透明边框归零，槽宽不变</p><p>绘制宽度 10px</p>
          <p>line</p><p>line</p><p>line</p><p>line</p><p>line</p><p>line</p>
          <p>line</p><p>line</p><p>line</p><p>line</p><p>line</p><p>line</p>
        </div>
        <figcaption>1:1 · 悬停 <span class="label">painted 10px</span></figcaption>
      </figure>
      <figure>
        <div class="zoom"><div class="panel" id="rest2">
          <p>静止</p><p>line</p><p>line</p><p>line</p><p>line</p><p>line</p>
          <p>line</p><p>line</p><p>line</p><p>line</p>
        </div></div>
        <figcaption style="margin-top: 172px">1.6×</figcaption>
      </figure>
      <figure>
        <div class="zoom"><div class="panel" id="armed2">
          <p>悬停</p><p>line</p><p>line</p><p>line</p><p>line</p><p>line</p>
          <p>line</p><p>line</p><p>line</p><p>line</p>
        </div></div>
        <figcaption style="margin-top: 172px">1.6×</figcaption>
      </figure>
    </div>
    <pre id="out" class="label" style="margin-top: 20px"></pre>
    <script>
      const ids = ['rest', 'armed', 'rest2', 'armed2']
      const rows = []
      for (const id of ids) {
        const el = document.getElementById(id)
        // offsetWidth - clientWidth also counts the panel's own 1px borders,
        // so subtract them to report the scrollbar gutter alone.
        const gutter = () => {
          const s = getComputedStyle(el)
          const frame = (parseFloat(s.borderLeftWidth) || 0) + (parseFloat(s.borderRightWidth) || 0)
          return el.offsetWidth - el.clientWidth - frame
        }
        const border = () =>
          parseFloat(getComputedStyle(el).getPropertyValue('--dsh-scrollbar-thumb-border')) || 0
        const painted = () => gutter() - 2 * border()
        if (id.startsWith('armed')) el.style.setProperty('--dsh-scrollbar-thumb-border', '0px')
        rows.push(`${id}: gutter=${gutter()} painted=${painted()} content=${el.clientWidth}`)
      }
      document.getElementById('out').textContent = rows.join('\n')
    </script>
  </body>
</html>
