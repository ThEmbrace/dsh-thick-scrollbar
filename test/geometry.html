<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>scrollbar geometry probe</title>
    <style>
      /* Baseline injected by dsh-thick-scrollbar, deliberately placed BEFORE
         the theme block below: the probe then proves `html body` outranks the
         theme's `body` by specificity, not by insertion order. */
      html body {
        --dsh-scrollbar-width: 10px;
        --dsh-scrollbar-thumb-border: 2.5px;
      }
    </style>
    <style>
      /* Verbatim copy of dsh-client-ui-theme scrollbar.css (the parts that
         decide geometry and paint), so the probe measures the real rules. */
      body {
        --dsh-scrollbar-thumb: #e5e5e5;
        --dsh-scrollbar-thumb-hover: #d4d4d4;
        --dsh-scrollbar-thumb-border: 0px;
        --dsh-scrollbar-track-margin: 0px;
        --dsh-scrollbar-width: 5px;
      }
      ::-webkit-scrollbar {
        width: var(--dsh-scrollbar-width);
        height: var(--dsh-scrollbar-width);
      }
      ::-webkit-scrollbar-track {
        margin-block: var(--dsh-scrollbar-track-margin);
        background: 0 0;
      }
      ::-webkit-scrollbar-thumb {
        border: var(--dsh-scrollbar-thumb-border) solid transparent;
        corner-shape: round;
        background: var(--dsh-scrollbar-thumb);
        background-clip: content-box;
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--dsh-scrollbar-thumb-hover);
      }
      ::-webkit-scrollbar-corner {
        background: 0 0;
      }
      #scroller {
        width: 300px;
        height: 200px;
        overflow-y: auto;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="scroller"><div style="height: 2000px">tall content</div></div>
    <pre id="out"></pre>
    <script>
      const el = document.getElementById('scroller')
      const gutter = () => el.offsetWidth - el.clientWidth
      const border = () =>
        parseFloat(getComputedStyle(el).getPropertyValue('--dsh-scrollbar-thumb-border')) || 0
      const painted = () => gutter() - 2 * border()
      const rows = []
      rows.push('restGutter=' + gutter())
      rows.push('restPainted=' + painted())
      rows.push('restContent=' + el.clientWidth)
      // Arm exactly like the plugin does: drop the transparent border only.
      el.style.setProperty('--dsh-scrollbar-thumb-border', '0px')
      rows.push('armedGutter=' + gutter())
      rows.push('armedPainted=' + painted())
      rows.push('armedContent=' + el.clientWidth)
      el.style.removeProperty('--dsh-scrollbar-thumb-border')
      rows.push('restoredPainted=' + painted())
      document.getElementById('out').textContent = 'RESULT ' + rows.join(' ')
    </script>
  </body>
</html>
